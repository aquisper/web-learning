<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Html page</title>
</head>
<body>
    <header>
        <h1>Alonso</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2>About me</h2>
            <p>I like to learn new things each day. My hobbies are: </p>
            <ul>
                <li>Reading</li>
                <li>Video games</li>
                <li>Playing the guitar</li>
            </ul>
        </section>
        <section id="skills">
            <h2>Skills</h2>
            <table>
                <thead>
                    <tr>
                        <th>Skill</th>
                        <th>Level</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>SQL</td>
                        <td>Intermediate</td>
                    </tr>
                    <tr>
                        <td>Python</td>
                        <td>Beginner</td>
                    </tr>
                    <tr>
                        <td>JavaScript</td>
                        <td>Beginner</td>
                    </tr>
                    <tr>
                        <td>C</td>
                        <td>Beginner</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <form>
                <label for="name">Enter your name:</label>
                <input type="text" name="name" id="name" required>
                <label for="email">Enter your email:</label>
                <input type="email" name="email" id="email">
                <label for="message">A personalized message</label>
                <textarea id="message" name="message"></textarea>
                <input type="submit" value="Send">
            </form>
        </section>

    </main>
    <footer>
        <p>Created by Alonso Quispe Ramirez — <a href="https://github.com/aquisper">See my GitHub page :D!</a></p>

    </footer>



</body>
</html>
